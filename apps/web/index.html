<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <script>
      // Boot diagnostics.
      //
      // Deliberately inline, dependency-free, and outside the module graph: it has
      // to keep working when that graph never evaluates, which is one of the very
      // failures it exists to report. It records only — it renders nothing and
      // never touches the page, so it cannot make a stalled boot worse than it
      // already is. Read the trace back from localStorage, or straight out of the
      // browser profile's LevelDB store when the tab is too wedged for a console.
      (() => {
        const TRACE_KEY = "t3code:boot-trace";
        const KEPT_ATTEMPTS = 5;
        const MAX_ERRORS = 10;


        const attempt = {
          startedAt: new Date().toISOString(),
          url: location.href,
          marks: [],
          errors: [],
        };

        // Read the earlier attempts once. localStorage is synchronous and this
        // runs on the boot critical path, so each later stage costs one small
        // write rather than a read-modify-write.
        let history = [];
        try {
          const stored = JSON.parse(window.localStorage.getItem(TRACE_KEY) || "[]");
          history = Array.isArray(stored) ? stored.slice(1 - KEPT_ATTEMPTS) : [];
        } catch {
          // Storage may be unavailable, full, or blocked. Losing the trace is
          // never worth failing the boot for.
        }

        const persist = () => {
          try {
            window.localStorage.setItem(TRACE_KEY, JSON.stringify(history.concat(attempt)));
          } catch {
            // As above: diagnostics must never break the boot they report on.
          }
        };

        const mark = (stage) => {
          attempt.marks.push({ stage, atMs: Math.round(performance.now()) });
          persist();
        };

        // Capture what the console would have shown.
        //
        // A module graph that downloads intact and then never evaluates has
        // thrown something, but by then the tab is wedged and its console is
        // unreachable — so the one piece of evidence that identifies the failing
        // module is exactly the one that cannot be read. Persisting it puts it in
        // localStorage, which survives the wedge and can be recovered afterwards.
        const recordError = (entry) => {
          if (attempt.errors.length >= MAX_ERRORS) {
            return;
          }
          entry.atMs = Math.round(performance.now());
          attempt.errors.push(entry);
          persist();
        };

        const clip = (value, limit) => String(value ?? "").slice(0, limit);

        // Capture phase: resource-load failures fire at the element and do not
        // bubble, so a listener on the bubble phase would never see them.
        window.addEventListener(
          "error",
          (event) => {
            try {
              const target = event.target;
              if (target && target !== window && target.tagName) {
                recordError({
                  kind: "resource",
                  tag: String(target.tagName).toLowerCase(),
                  url: clip(target.src || target.href, 300),
                });
                return;
              }
              recordError({
                kind: "error",
                message: clip(event.message, 500),
                source: clip(event.filename, 300),
                line: event.lineno,
                column: event.colno,
                stack: clip(event.error && event.error.stack, 2000),
              });
            } catch {
              // Never let the reporter throw inside the failure it is reporting.
            }
          },
          true,
        );

        window.addEventListener("unhandledrejection", (event) => {
          try {
            const reason = event.reason;
            recordError({
              kind: "unhandledrejection",
              message: clip((reason && reason.message) || reason, 500),
              stack: clip(reason && reason.stack, 2000),
            });
          } catch {
            // As above.
          }
        });

        window.__t3codeBootMark = mark;
        mark("html-parsed");

        // Module scripts are deferred: they execute only once the document has
        // finished parsing. So a document whose response stalls mid-stream stops
        // the app without any error, any pending fetch, or any await — the graph
        // is downloaded and simply never runs. `body-parsed` (emitted at the end
        // of <body>) and `dom-ready` separate that from a graph that finished
        // parsing and still refused to evaluate. Both were reached on 2026-08-01,
        // so the document is not the problem.
        document.addEventListener("DOMContentLoaded", () => mark("dom-ready"));
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Classic script: runs as the parser reaches it, unlike the deferred module
         above. Its absence from the trace means the document never got this far. -->
    <script>
      window.__t3codeBootMark && window.__t3codeBootMark("body-parsed");
    </script>
  </body>
</html>
