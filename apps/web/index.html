<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <script>
      // Boot diagnostics.
      //
      // Deliberately inline, dependency-free, and outside the module graph: it has
      // to keep working when that graph never evaluates, which is one of the very
      // failures it exists to report. A stalled boot otherwise leaves the splash
      // below on screen forever with no console output, no failed request, and no
      // way to tell how far the app actually got.
      (() => {
        const TRACE_KEY = "t3code:boot-trace";
        const KEPT_ATTEMPTS = 5;
        const WATCHDOG_MS = 30_000;
        const COMPLETE_STAGE = "app-rendered";

        // Ordered. The first stage missing from a stalled boot is the diagnosis.
        const STAGES = [
          {
            name: "html-parsed",
            detail:
              "The document did not finish parsing. The page was served but stalled before running any script.",
          },
          {
            name: "module-eval",
            detail:
              "The page never executed its JavaScript. The module graph did not finish loading, which points at the dev server, the network, or a wedged browser HTTP cache rather than at the application. Try a hard reload; if that does not help, clear this browser profile's cached files.",
          },
          {
            name: "react-render",
            detail: "JavaScript loaded, but React was never asked to render.",
          },
          {
            name: "route-load-start",
            detail: "React started, but the router never began loading the root route.",
          },
          {
            name: "route-load-end",
            detail:
              "The root route's initial load never finished. The app is waiting on the server session request, which has no timeout.",
          },
          {
            name: COMPLETE_STAGE,
            detail: "The root route loaded, but the app never mounted.",
          },
        ];

        const attempt = { startedAt: new Date().toISOString(), url: location.href, marks: [] };
        let complete = false;

        // Read the earlier attempts once. localStorage is synchronous and this
        // runs on the boot critical path, so each later stage costs one small
        // write rather than a read-modify-write.
        let history = [];
        try {
          const stored = JSON.parse(window.localStorage.getItem(TRACE_KEY) || "[]");
          history = Array.isArray(stored) ? stored.slice(1 - KEPT_ATTEMPTS) : [];
        } catch {
          // Storage may be unavailable, full, or blocked. The in-memory trace
          // still drives the overlay, so this is never worth failing the boot for.
        }

        const persist = () => {
          try {
            window.localStorage.setItem(TRACE_KEY, JSON.stringify(history.concat(attempt)));
          } catch {
            // As above: diagnostics must never break the boot they report on.
          }
        };

        const mark = (stage) => {
          attempt.marks.push({ stage, atMs: Math.round(performance.now()) });
          if (stage === COMPLETE_STAGE) {
            complete = true;
          }
          persist();
        };

        const reached = (name) => attempt.marks.some((entry) => entry.stage === name);

        const diagnose = () => {
          const stalled = STAGES.find((stage) => !reached(stage.name));
          return stalled
            ? { stage: stalled.name, detail: stalled.detail }
            : { stage: "unknown", detail: "Every boot stage was reached but the app is not running." };
        };

        const render = () => {
          const root = document.getElementById("root");
          if (!root) {
            return;
          }

          const { stage, detail } = diagnose();
          const panel = document.createElement("div");
          panel.setAttribute("role", "alert");
          panel.style.cssText =
            "max-width:44rem;margin:0 auto;padding:2rem 1.5rem;font:14px/1.6 system-ui,sans-serif;color:inherit";

          const heading = document.createElement("h1");
          heading.textContent = "T3 Code did not finish starting";
          heading.style.cssText = "margin:0 0 .5rem;font-size:1.25rem;font-weight:600";
          panel.append(heading);

          const summary = document.createElement("p");
          summary.textContent =
            "Gave up after " + WATCHDOG_MS / 1000 + "s. First stage not reached: " + stage + ".";
          summary.style.cssText = "margin:0 0 1rem;opacity:.75";
          panel.append(summary);

          const explanation = document.createElement("p");
          explanation.textContent = detail;
          explanation.style.cssText = "margin:0 0 1.5rem";
          panel.append(explanation);

          const trace = document.createElement("pre");
          trace.textContent = attempt.marks
            .map((entry) => String(entry.atMs).padStart(6) + " ms  " + entry.stage)
            .join("\n");
          trace.style.cssText =
            "margin:0 0 1.5rem;padding:.75rem 1rem;overflow-x:auto;border-radius:.5rem;" +
            "background:rgba(127,127,127,.12);font:12px/1.5 ui-monospace,monospace";
          panel.append(trace);

          const actions = document.createElement("div");
          actions.style.cssText = "display:flex;gap:.5rem;flex-wrap:wrap";

          const button = (label, onClick) => {
            const element = document.createElement("button");
            element.type = "button";
            element.textContent = label;
            element.style.cssText =
              "padding:.5rem .9rem;border:1px solid rgba(127,127,127,.4);border-radius:.5rem;" +
              "background:transparent;color:inherit;font:inherit;cursor:pointer";
            element.addEventListener("click", onClick);
            return element;
          };

          actions.append(button("Reload", () => location.reload()));
          actions.append(
            button("Copy diagnostics", (event) => {
              const payload = JSON.stringify(
                { diagnosis: stage, userAgent: navigator.userAgent, attempt },
                null,
                2,
              );
              navigator.clipboard?.writeText(payload).then(
                () => {
                  event.currentTarget.textContent = "Copied";
                },
                () => {
                  event.currentTarget.textContent = "Copy failed";
                },
              );
            }),
          );

          panel.append(actions);
          root.replaceChildren(panel);
        };

        window.__t3codeBootMark = mark;
        mark("html-parsed");
        window.setTimeout(() => {
          if (!complete) {
            render();
          }
        }, WATCHDOG_MS);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
