<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#161616" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#161616";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("t3code:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <script>
      // Boot diagnostics.
      //
      // Deliberately inline, dependency-free, and outside the module graph: it has
      // to keep working when that graph never evaluates, which is one of the very
      // failures it exists to report. A stalled boot otherwise leaves the splash
      // below on screen forever with no console output, no failed request, and no
      // way to tell how far the app actually got.
      (() => {
        const TRACE_KEY = "t3code:boot-trace";
        const KEPT_ATTEMPTS = 5;
        const MAX_ERRORS = 10;
        const WATCHDOG_MS = 30_000;
        const COMPLETE_STAGE = "app-rendered";

        // Ordered. The first stage missing from a stalled boot is the diagnosis.
        const STAGES = [
          {
            name: "html-parsed",
            detail:
              "The document did not finish parsing. The page was served but stalled before running any script.",
          },
          {
            name: "module-eval",
            detail:
              "The page never executed its JavaScript. The module graph did not finish loading, which points at the dev server, the network, or a wedged browser HTTP cache rather than at the application. Try a hard reload; if that does not help, clear this browser profile's cached files.",
          },
          {
            name: "react-render",
            detail: "JavaScript loaded, but React was never asked to render.",
          },
          {
            name: "route-load-start",
            detail: "React started, but the router never began loading the root route.",
          },
          {
            name: "route-load-end",
            detail:
              "The root route's initial load never finished. The app is waiting on the server session request, which has no timeout.",
          },
          {
            name: COMPLETE_STAGE,
            detail: "The root route loaded, but the app never mounted.",
          },
        ];

        const attempt = {
          startedAt: new Date().toISOString(),
          url: location.href,
          marks: [],
          errors: [],
        };
        let complete = false;

        // Read the earlier attempts once. localStorage is synchronous and this
        // runs on the boot critical path, so each later stage costs one small
        // write rather than a read-modify-write.
        let history = [];
        try {
          const stored = JSON.parse(window.localStorage.getItem(TRACE_KEY) || "[]");
          history = Array.isArray(stored) ? stored.slice(1 - KEPT_ATTEMPTS) : [];
        } catch {
          // Storage may be unavailable, full, or blocked. The in-memory trace
          // still drives the overlay, so this is never worth failing the boot for.
        }

        const persist = () => {
          try {
            window.localStorage.setItem(TRACE_KEY, JSON.stringify(history.concat(attempt)));
          } catch {
            // As above: diagnostics must never break the boot they report on.
          }
        };

        const mark = (stage) => {
          attempt.marks.push({ stage, atMs: Math.round(performance.now()) });
          if (stage === COMPLETE_STAGE) {
            complete = true;
          }
          persist();
        };

        const reached = (name) => attempt.marks.some((entry) => entry.stage === name);

        // Capture what the console would have shown.
        //
        // A module graph that downloads intact and then never evaluates has
        // thrown something, but by then the tab is wedged and its console is
        // unreachable — so the one piece of evidence that identifies the failing
        // module is exactly the one that cannot be read. Persisting it puts it in
        // localStorage, which survives the wedge and can be recovered afterwards.
        const recordError = (entry) => {
          if (attempt.errors.length >= MAX_ERRORS) {
            return;
          }
          entry.atMs = Math.round(performance.now());
          attempt.errors.push(entry);
          persist();
        };

        const clip = (value, limit) => String(value ?? "").slice(0, limit);

        // Capture phase: resource-load failures fire at the element and do not
        // bubble, so a listener on the bubble phase would never see them.
        window.addEventListener(
          "error",
          (event) => {
            try {
              const target = event.target;
              if (target && target !== window && target.tagName) {
                recordError({
                  kind: "resource",
                  tag: String(target.tagName).toLowerCase(),
                  url: clip(target.src || target.href, 300),
                });
                return;
              }
              recordError({
                kind: "error",
                message: clip(event.message, 500),
                source: clip(event.filename, 300),
                line: event.lineno,
                column: event.colno,
                stack: clip(event.error && event.error.stack, 2000),
              });
            } catch {
              // Never let the reporter throw inside the failure it is reporting.
            }
          },
          true,
        );

        window.addEventListener("unhandledrejection", (event) => {
          try {
            const reason = event.reason;
            recordError({
              kind: "unhandledrejection",
              message: clip((reason && reason.message) || reason, 500),
              stack: clip(reason && reason.stack, 2000),
            });
          } catch {
            // As above.
          }
        });

        const diagnose = () => {
          // `#root` lives in <body>. If it is gone while `html-parsed` was reached,
          // the document response itself stopped arriving after <head>: <body> never
          // parsed, so the page is blank rather than showing the splash and the
          // module graph never got a chance. Blaming the modules here would point
          // at the wrong layer.
          if (reached("html-parsed") && !document.getElementById("root")) {
            return {
              stage: "document-truncated",
              detail:
                "The HTML document stopped arriving after <head>, so <body> never parsed — that is why the page is blank instead of showing the splash. The document request itself stalled, which points at the network path or the browser's HTTP cache rather than at the application.",
            };
          }

          const stalled = STAGES.find((stage) => !reached(stage.name));
          return stalled
            ? { stage: stalled.name, detail: stalled.detail }
            : { stage: "unknown", detail: "Every boot stage was reached but the app is not running." };
        };

        const render = () => {
          // A stalled document is the case this most needs to survive: if the
          // response stops after <head> then <body>, and therefore `#root`, never
          // exist. Bailing out when `#root` is missing would go silent at exactly
          // the moment there is something worth saying, so fall back to whatever
          // host does exist — `documentElement` is always there.
          const root = document.getElementById("root");
          const host = root ?? document.body ?? document.documentElement;
          if (!host) {
            return;
          }

          const { stage, detail } = diagnose();
          // Pinned and explicitly coloured rather than inheriting: when the host is
          // `documentElement` there is no <body> to inherit from, and an overlay
          // that renders invisibly is no better than one that never renders.
          const dark = document.documentElement.classList.contains("dark");
          const panel = document.createElement("div");
          panel.setAttribute("role", "alert");
          panel.style.cssText =
            "position:fixed;inset:0;z-index:2147483647;overflow:auto;" +
            "padding:2rem 1.5rem;font:14px/1.6 system-ui,sans-serif;" +
            "background:" +
            (dark ? "#161616" : "#ffffff") +
            ";color:" +
            (dark ? "#f5f5f5" : "#262626");

          const content = document.createElement("div");
          content.style.cssText = "max-width:44rem;margin:0 auto";
          panel.append(content);

          const heading = document.createElement("h1");
          heading.textContent = "T3 Code did not finish starting";
          heading.style.cssText = "margin:0 0 .5rem;font-size:1.25rem;font-weight:600";
          content.append(heading);

          const summary = document.createElement("p");
          summary.textContent =
            "Gave up after " + WATCHDOG_MS / 1000 + "s. Diagnosis: " + stage + ".";
          summary.style.cssText = "margin:0 0 1rem;opacity:.75";
          content.append(summary);

          const explanation = document.createElement("p");
          explanation.textContent = detail;
          explanation.style.cssText = "margin:0 0 1.5rem";
          content.append(explanation);

          const trace = document.createElement("pre");
          trace.textContent = attempt.marks
            .map((entry) => String(entry.atMs).padStart(6) + " ms  " + entry.stage)
            .concat(
              attempt.errors.map(
                (entry) =>
                  String(entry.atMs).padStart(6) +
                  " ms  " +
                  entry.kind.toUpperCase() +
                  "  " +
                  (entry.message || entry.url || "") +
                  (entry.source ? "\n              at " + entry.source : ""),
              ),
            )
            .join("\n");
          trace.style.cssText =
            "margin:0 0 1.5rem;padding:.75rem 1rem;overflow-x:auto;border-radius:.5rem;" +
            "background:rgba(127,127,127,.12);font:12px/1.5 ui-monospace,monospace";
          content.append(trace);

          const actions = document.createElement("div");
          actions.style.cssText = "display:flex;gap:.5rem;flex-wrap:wrap";

          const button = (label, onClick) => {
            const element = document.createElement("button");
            element.type = "button";
            element.textContent = label;
            element.style.cssText =
              "padding:.5rem .9rem;border:1px solid rgba(127,127,127,.4);border-radius:.5rem;" +
              "background:transparent;color:inherit;font:inherit;cursor:pointer";
            element.addEventListener("click", onClick);
            return element;
          };

          actions.append(button("Reload", () => location.reload()));
          actions.append(
            button("Copy diagnostics", (event) => {
              const payload = JSON.stringify(
                { diagnosis: stage, userAgent: navigator.userAgent, attempt },
                null,
                2,
              );
              navigator.clipboard?.writeText(payload).then(
                () => {
                  event.currentTarget.textContent = "Copied";
                },
                () => {
                  event.currentTarget.textContent = "Copy failed";
                },
              );
            }),
          );

          content.append(actions);
          if (root) {
            root.replaceChildren(panel);
          } else {
            host.append(panel);
          }
        };

        window.__t3codeBootMark = mark;
        mark("html-parsed");

        // Module scripts are deferred: they execute only once the document has
        // finished parsing. So a document whose response stalls mid-stream stops
        // the app without any error, any pending fetch, or any await — the graph
        // is downloaded and simply never runs. `body-parsed` (emitted at the end
        // of <body>) and `dom-ready` separate that from a graph that finished
        // parsing and still refused to evaluate.
        document.addEventListener("DOMContentLoaded", () => mark("dom-ready"));
        window.setTimeout(() => {
          if (!complete) {
            render();
          }
        }, WATCHDOG_MS);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans Variable",
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #161616;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
    <title>T3 Code (Alpha)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="T3 Code splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="T3 Code" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Classic script: runs as the parser reaches it, unlike the deferred module
         above. Its absence from the trace means the document never got this far. -->
    <script>
      window.__t3codeBootMark && window.__t3codeBootMark("body-parsed");
    </script>
  </body>
</html>
